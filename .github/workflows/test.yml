name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv
      - name: Install package + dev deps
        run: uv pip install --system -e ".[dev]"
      - name: Run tests
        run: pytest -v
      - name: CLI smoke (stub mode)
        run: |
          harnessprobe version
          harnessprobe profiles
          harnessprobe match --models deepseek-v4,qwen3-8,kimi-k3 --n 5 --save /tmp/state.json --html /tmp/r.html --repro /tmp/r.zip
          harnessprobe report --state /tmp/state.json --out /tmp/r2.html
