<svg xmlns="http://www.w3.org/2000/svg" width="400" height="840" viewBox="0 0 400 840" data-palette="56e6c4-6ac1e7-acf6ca-986bd3b07a57" role="img" aria-labelledby="process-mobile-dark-title process-mobile-dark-desc"><title id="process-mobile-dark-title">HarnessProbe process</title><desc id="process-mobile-dark-desc">No completion requests, generated answers or scores.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="400" y2="840"><stop stop-color="#56e6c4"/><stop offset=".6" stop-color="#6ac1e7"/><stop offset="1" stop-color="#acf6ca"/></linearGradient><radialGradient id="halo"><stop stop-color="#56e6c4" stop-opacity=".22"/><stop offset="1" stop-color="#050c11" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#173c38" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#56e6c4" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="400" height="840" rx="16" fill="#050c11"/><rect width="400" height="840" rx="16" fill="url(#grid)"/><ellipse cx="252.0" cy="361.2" rx="200.0" ry="588.0" fill="url(#halo)"/><text x="28" y="44" fill="#95b9be" font-size="13" text-anchor="start" font-weight="400">PROCESS / FROM INPUT TO RESULT</text><text x="28" y="84.0" fill="#eefdf4" font-size="25" text-anchor="start" font-weight="400">Validate before sending</text><text x="28" y="119.0" fill="#eefdf4" font-size="25" text-anchor="start" font-weight="400">a request</text><path d="M200 257V290" fill="none" stroke="#56e6c4" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200 257V290" class="flow" fill="none" stroke="#acf6ca" stroke-width="2"/><rect x="28" y="135" width="344" height="122" rx="12" fill="#0c171d" stroke="#173c38"/><text x="46" y="166.0" fill="#eefdf4" font-size="21" text-anchor="start" font-weight="400">01  Load local YAML</text><text x="46" y="218.0" fill="#95b9be" font-size="17" text-anchor="start" font-weight="400">Constructed model identifier</text><path d="M200 412V445" fill="none" stroke="#56e6c4" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200 412V445" class="flow" fill="none" stroke="#acf6ca" stroke-width="2"/><rect x="28" y="290" width="344" height="122" rx="12" fill="#0c171d" stroke="#173c38"/><text x="46" y="321.0" fill="#eefdf4" font-size="21" text-anchor="start" font-weight="400">02  Validate fields</text><text x="46" y="373.0" fill="#95b9be" font-size="17" text-anchor="start" font-weight="400">64-token limit and END stop</text><path d="M200 567V600" fill="none" stroke="#56e6c4" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200 567V600" class="flow" fill="none" stroke="#acf6ca" stroke-width="2"/><rect x="28" y="445" width="344" height="122" rx="12" fill="#0c171d" stroke="#173c38"/><text x="46" y="476.0" fill="#eefdf4" font-size="21" text-anchor="start" font-weight="400">03  Inspect mode</text><text x="46" y="528.0" fill="#95b9be" font-size="17" text-anchor="start" font-weight="400">No key → stub route</text><rect x="28" y="600" width="344" height="122" rx="12" fill="#0c171d" stroke="#173c38"/><text x="46" y="631.0" fill="#eefdf4" font-size="21" text-anchor="start" font-weight="400">04  Reject bad effort</text><text x="46" y="683.0" fill="#95b9be" font-size="17" text-anchor="start" font-weight="400">Schema validation fails</text><text x="28" y="775.0" fill="#acf6ca" font-size="18" text-anchor="start" font-weight="400">No completion requests, generated</text><text x="28" y="800.2" fill="#acf6ca" font-size="18" text-anchor="start" font-weight="400">answers or scores.</text></svg>
