[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "harnessprobe"
version = "0.1.0"
description = "Validate declared harness profiles, run an arithmetic benchmark subset through compatible endpoints, and export comparison reports and run artifacts."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SuperMarioYL" }]
keywords = ["llm", "benchmark", "evaluation", "harness", "deepseek", "qwen", "kimi", "procurement", "aime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.40.0",
    "pydantic>=2.7",
    "rich>=13.7",
    "jinja2>=3.1",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
harnessprobe = "harnessprobe.cli:app"

[project.urls]
Homepage = "https://github.com/SuperMarioYL/harnessprobe"
Repository = "https://github.com/SuperMarioYL/harnessprobe"
Issues = "https://github.com/SuperMarioYL/harnessprobe/issues"

[tool.hatch.build.targets.wheel]
packages = ["harnessprobe"]

[tool.hatch.build.targets.wheel.force-include]
"harnessprobe/profiles" = "harnessprobe/profiles"
"harnessprobe/templates" = "harnessprobe/templates"

[tool.hatch.build.targets.sdist]
include = [
    "harnessprobe",
    "tests",
    "assets",
    "docs",
    "examples",
    "README.md",
    "README.en.md",
    "LICENSE",
    "VERSION",
    ".github",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
